# A healthy snapshot + InPlace restore cycle on a Portworx cluster whose snapshot
# names carry NO parent volume ("px_<cluster>-snapshot-<uuid>"), unlike the
# "<volume>.<suffix>" form. Pins three things:
#   - the parent-volume check must say it cannot judge, not stay silent
#   - a CDI VolumeCloneSource populator must resolve to the PVC it wraps, so the
#     "sources disagree" note does not fire on a wrapper
#   - after an InPlace restore the PVC name is reused by a NEWER object, which must
#     not be reported as "the source PVC still exists"
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-snapshot-test
  namespace: playground
spec:
  runStrategy: RerunOnFailure
  template:
    spec:
      volumes:
        - name: rootdisk
          dataVolume:
            name: vm-snapshot-test
        - name: cloudinitdisk
          cloudInitNoCloud:
            userDataBase64: I2Nsb3VkLWNvbmZpZwo=
status:
  printableStatus: Stopped
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: vm-snapshot-test
  namespace: playground
spec:
  source:
    pvc:
      name: fedora-1217dcc8c58d
      namespace: openshift-virtualization-os-images
status:
  claimName: vm-snapshot-test
  phase: Succeeded
  progress: 100.0%
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fedora-1217dcc8c58d
  namespace: openshift-virtualization-os-images
spec:
  storageClassName: deerls6pst303v4
  volumeMode: Block
status:
  phase: Bound
  capacity:
    storage: 30Gi
---
# The populator CDI created for the clone. Its spec.source is the very PVC the
# DataVolume declares, so the two do NOT disagree.
apiVersion: cdi.kubevirt.io/v1beta1
kind: VolumeCloneSource
metadata:
  name: volume-clone-source-923d03bf-c651-4782-8887-44171f171d6c
  namespace: playground
spec:
  source:
    kind: PersistentVolumeClaim
    name: fedora-1217dcc8c58d
---
# Recreated by the InPlace restore: same name, but created AFTER the snapshot.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vm-snapshot-test
  namespace: playground
  creationTimestamp: "2026-07-30T10:07:32Z"
spec:
  storageClassName: deerls6pst303v4
  volumeMode: Block
  accessModes: ["ReadWriteMany"]
  volumeName: pvc-3395cfb3-5518-4d2d-90c8-c534f55d9c16
  resources:
    requests:
      storage: 30Gi
  dataSourceRef:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: vmsnapshot-b7fee618-volume-rootdisk
status:
  phase: Bound
  capacity:
    storage: 30Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvc-3395cfb3-5518-4d2d-90c8-c534f55d9c16
spec:
  persistentVolumeReclaimPolicy: Delete
  capacity:
    storage: 30Gi
  claimRef:
    name: vm-snapshot-test
    namespace: playground
  csi:
    driver: pxd.portworx.com
    volumeHandle: d2a7ffd7-cc0f-daad-c67d-826478f75cdd
status:
  phase: Bound
---
apiVersion: pure.portworx.com/v1alpha1
kind: PureVolume
metadata:
  name: d2a7ffd7-cc0f-daad-c67d-826478f75cdd
spec:
  volumeName: px_def03c34-pvc-3395cfb3-5518-4d2d-90c8-c534f55d9c16
